site_name: 2CDC ML/AI Strategy
site_description: Teorijski pregled algoritamskih porodica za dva 2CDC problema
strict: true
theme:
  name: material
  custom_dir: ../site-assets
  language: sr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-course
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - mermaid-11.17.0/mermaid.min.js
  - mermaid.js
  - mathjax.js
  - mathjax-3.2.2/tex-mml-chtml.js

extra_css:
  - extra.css

watch:
  - ../site-assets

nav:
  - Početak i putanja:
      - Početna: index.md
      - ML/AI od nule - osnovni i uslovni prolaz: 00a-osnove-ml.md
      - Merodavna početnička putanja: 11-ml-ai-plan-ucenja.md
      - Scope - orijentacija i granice: 00-scope.md
      - Pipeline - orijentaciona mapa: 01-pipeline-decision-map.md
  - Podaci i preduslovi:
      - Cross-format i eligibility: 09-cross-format-eligibility.md
  - Deterministička osnova - prvi prolaz:
      - Parovi - mapping i 3D: 04-precise-pairwise.md
      - Pretraga - exact i ANN kandidati: 03-global-retrieval-ann-ranking.md
  - Osnovna evaluacija i modeli:
      - Evaluacija bez neuralnih preduslova: https://github.com/nemper/crystallography-and-ml-theory/blob/main/chemistry-foundations/docs/20-evaluacija.md
      - Klasični ML - boosting i kernel pre naprednih grana: 02-classical-ml.md
  - Povratak posle boostinga i kernel uvoda:
      - SOAP i druge napredne grane poređenja: https://github.com/nemper/crystallography-and-ml-theory/blob/main/ml-ai-strategy/docs/04-precise-pairwise.md#soap-rematch-reference
      - Učenje rangiranja: https://github.com/nemper/crystallography-and-ml-theory/blob/main/ml-ai-strategy/docs/03-global-retrieval-ann-ranking.md#rangiranje-primer
  - Uslovna neuralna grana:
      - Periodični encoderi: 05-periodic-crystal-encoders.md
      - Metric learning i detaljna evaluacija: 06-metric-learning-and-evaluation.md
  - Uslovna jezička grana:
      - Lokalni SLM i RAG: 07-local-slm-rag.md
      - Spoljni LLM API i bezbednost: 08-api-llm-security.md
  - Sinteza i referenca:
      - Algoritamske porodice - drugi prolaz: 10-optimal-stack-roadmap.md
      - Metod dokaza: evidence-method.md
