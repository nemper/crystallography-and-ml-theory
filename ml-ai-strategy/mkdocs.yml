site_name: 2CDC ML/AI Strategy
site_description: Teorijski pregled algoritamskih porodica za dva 2CDC problema
strict: true
theme:
  name: material
  custom_dir: ../site-assets
  language: sr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-course
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - mermaid-11.17.0/mermaid.min.js
  - mermaid.js
  - mathjax.js
  - mathjax-3.2.2/tex-mml-chtml.js

extra_css:
  - extra.css

watch:
  - ../site-assets

nav:
  - Početna: index.md
  - ML/AI od nule: 00a-osnove-ml.md
  - Plan učenja za početnika i ML inženjera: 11-ml-ai-plan-ucenja.md
  - Scope i teorijska granica: 00-scope.md
  - Pipeline i teorijska mapa odluka: 01-pipeline-decision-map.md
  - Podaci i eligibility:
      - Cross-format reconciliation i eligibility: 09-cross-format-eligibility.md
  - Teorijska mapa:
      - Algoritamske porodice i uslovi primene: 10-optimal-stack-roadmap.md
  - Klasični ML:
      - Modeli i eksperimenti: 02-classical-ml.md
  - Globalna pretraga:
      - Retrieval, ANN i rangiranje: 03-global-retrieval-ann-ranking.md
  - Precizno poređenje parova:
      - Algoritmi i evidence: 04-precise-pairwise.md
  - Deep crystal modeli:
      - Periodični encoderi: 05-periodic-crystal-encoders.md
      - Metric learning i evaluacija: 06-metric-learning-and-evaluation.md
  - Jezički modeli:
      - Lokalni SLM, kontrolisana interpretacija i RAG: 07-local-slm-rag.md
      - Spoljni LLM API i bezbednost: 08-api-llm-security.md
  - Referenca:
      - Metod dokaza: evidence-method.md
