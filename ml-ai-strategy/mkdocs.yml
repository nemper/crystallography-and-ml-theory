site_name: 2CDC ML/AI Strategy
site_description: Evidence-driven izbor algoritama za dve 2CDC aplikacije
strict: true
theme:
  name: material
  language: sr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-course
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Početna: index.md
  - Plan učenja za ML inženjera: learning/11-ml-ai-plan-ucenja.md
  - Scope i odluke: 00-scope.md
  - Pipeline i decision gates: 01-pipeline-decision-map.md
  - Ugovori podataka:
      - Cross-format i lifecycle eligibility: data/09-cross-format-eligibility.md
  - Konačna odluka:
      - Optimalni stack i fazni roadmap: roadmap/10-optimal-stack-roadmap.md
  - Klasični ML:
      - Modeli i eksperimenti: classical/02-classical-ml.md
  - Globalna pretraga:
      - Retrieval, ANN i rangiranje: retrieval/03-global-retrieval-ann-ranking.md
  - Precizno poređenje parova:
      - Algoritmi i evidence: pairs/04-precise-pairwise.md
  - Deep crystal modeli:
      - Periodični encoderi: deep/05-periodic-crystal-encoders.md
      - Metric learning i evaluacija: deep/06-metric-learning-and-evaluation.md
  - Jezički modeli:
      - Lokalni SLM, DSL i RAG: language/07-local-slm-rag.md
      - Spoljni LLM API i bezbednost: language/08-api-llm-security.md
  - Referenca:
      - Metod dokaza: reference/evidence-method.md
      - Završni validacioni audit: reference/final-validation-2026-08-23.md
